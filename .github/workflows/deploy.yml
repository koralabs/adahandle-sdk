name: adahandle-sdk
on:
  push:
    branches:
      - master
jobs:
  deploy:
    name: Deploying from ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v1
      with:
        fetch-depth: 0
    - name: Verify local test evidence (tests run locally, never in Actions)
      run: |
        c=$(jq -er 'select(.result == "pass") | .commit' .local-test-evidence.json) && git diff --quiet "$c" HEAD -- . ':!.local-test-evidence.json' || { echo "::error::no valid local test evidence for this commit: run adahandle-deployments/common/test-evidence.sh record locally and push the evidence commit"; exit 1; }

    - name: Publish ${{ github.workflow }}
      id: publish
      env:
        DEPLOYMENT_ACCESS_TOKEN: ${{ secrets.DEPLOYMENT_ACCESS_TOKEN }}
        SECRETS_CONTEXT: ${{ toJson(secrets) }}
        VARS_CONTEXT: ${{ toJson(vars) }}
        GITHUB_CONTEXT: ${{ toJson(github) }}
        DEPLOYMENT_TYPE: npm-publish
        NODE_VERSION: 26
        IS_PUBLIC: true
      run: |
        set -eu
        curl -H "Authorization: Bearer ${DEPLOYMENT_ACCESS_TOKEN}" https://raw.githubusercontent.com/koralabs/adahandle-deployments/master/common/main.sh -o main.sh
        chmod +x main.sh && ./main.sh
